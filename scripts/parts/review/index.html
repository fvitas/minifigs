<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Part review · assembled</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #171c3a;
        --muted: #7b7f93;
        --line: #dcdde3;
        --base: #f2f2f4;
        --red: #e3000b;
        --green: #12a150;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: 'DM Sans', sans-serif;
        color: var(--navy);
        background: var(--base);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto auto auto;
        height: 100dvh;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 18px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .tabs {
        display: flex;
        gap: 4px;
      }
      .btn,
      .tab {
        font:
          500 12px/1 'DM Mono',
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        border-radius: 999px;
        padding: 9px 14px;
        cursor: pointer;
      }
      .tab.is-on {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .tab b {
        color: var(--red);
        margin-left: 6px;
      }
      .tab.is-on b {
        color: #ff8a90;
      }
      .btn kbd {
        font: inherit;
        opacity: 0.6;
        margin-left: 6px;
      }
      .btn:hover {
        border-color: var(--navy);
        color: var(--navy);
      }
      .btn.is-on {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .btn.bad {
        border-color: var(--red);
        color: var(--red);
      }
      .btn.good {
        border-color: var(--green);
        color: var(--green);
      }
      .stats,
      .saved {
        font:
          12px/1.4 'DM Mono',
          monospace;
        color: var(--muted);
      }
      .saved {
        margin-left: auto;
        text-align: right;
      }
      .stage {
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 10px;
      }
      .figure {
        position: relative;
      }
      .layer {
        position: absolute;
        left: 0;
        display: block;
        transition: bottom 0.35s cubic-bezier(0.2, 0.9, 0.2, 1.1);
      }
      .title {
        text-align: center;
        padding: 2px 18px 0;
      }
      .title h2 {
        margin: 0;
        font-size: 19px;
      }
      .title p {
        margin: 3px 0 0;
        font:
          12px/1.4 'DM Mono',
          monospace;
        color: var(--muted);
      }
      .strip {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 10px 18px;
        scrollbar-width: thin;
      }
      .strip img {
        width: 46px;
        height: 46px;
        border-radius: 8px;
        background: #fff;
        border: 2px solid var(--line);
        object-fit: contain;
        cursor: pointer;
        flex: 0 0 auto;
        opacity: 0.55;
      }
      .strip img.good {
        border-color: var(--green);
        opacity: 1;
      }
      .strip img.bad {
        border-color: var(--red);
        opacity: 1;
      }
      .strip img.is-current {
        outline: 2px solid var(--navy);
        outline-offset: 1px;
        opacity: 1;
      }
      .actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 0 18px 14px;
      }
      .hint {
        font:
          11px/1 'DM Mono',
          monospace;
        color: var(--muted);
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="tabs" id="tabs"></div>
      <div class="stats" id="stats"></div>
      <button class="btn" id="shuffle">Shuffle rest <kbd>S</kbd></button>
      <button class="btn" id="explode">Take apart <kbd>E</kbd></button>
      <button class="btn" id="reset">Reset slot</button>
      <div class="saved" id="saved"></div>
    </header>
    <section class="stage" id="stage"><div class="figure" id="figure"></div></section>
    <div class="title">
      <h2 id="title"></h2>
      <p id="sub"></p>
    </div>
    <div class="strip" id="strip"></div>
    <div class="actions">
      <button class="btn" id="undo">Undo <kbd>Backspace</kbd></button>
      <button class="btn bad" id="bad">Not good <kbd>←</kbd></button>
      <button class="btn good" id="good">Good <kbd>→</kbd></button>
      <span class="hint">↑ ↓ browse without judging · 1–4 slot</span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
