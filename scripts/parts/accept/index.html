<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accept · keep or revert the new torsos</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #171c3a;
        --muted: #7b7f93;
        --line: #dcdde3;
        --base: #f2f2f4;
        --green: #1f8a54;
        --amber: #d98b00;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: 'DM Sans', sans-serif;
        color: var(--navy);
        background: var(--base);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100dvh;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 15px;
        margin: 0 4px 0 0;
      }
      .btn {
        font:
          500 12px/1 'DM Mono',
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        border-radius: 999px;
        padding: 9px 14px;
        cursor: pointer;
      }
      .btn kbd {
        font: inherit;
        opacity: 0.6;
        margin-left: 6px;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--navy);
        color: var(--navy);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn.is-on {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }
      .btn.keep.is-on {
        background: var(--green);
        border-color: var(--green);
      }
      .btn.revert.is-on {
        background: var(--amber);
        border-color: var(--amber);
      }
      .stats,
      .saved {
        font:
          12px/1.4 'DM Mono',
          monospace;
        color: var(--muted);
      }
      .saved {
        margin-left: auto;
        text-align: right;
      }
      main {
        display: grid;
        grid-template-columns: 268px minmax(0, 1fr);
        min-height: 0;
      }
      .list {
        overflow-y: auto;
        border-right: 1px solid var(--line);
        background: #fff;
        padding: 8px 0 24px;
        scrollbar-width: thin;
      }
      .list p {
        margin: 0;
        padding: 10px 18px;
        font:
          12px/1.5 'DM Mono',
          monospace;
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 0;
        background: none;
        text-align: left;
        font: inherit;
        font-size: 14px;
        color: var(--navy);
        padding: 7px 18px;
        cursor: pointer;
        border-left: 3px solid transparent;
      }
      .row:hover {
        background: var(--base);
      }
      .row.is-current {
        border-left-color: var(--navy);
        background: var(--base);
        font-weight: 600;
      }
      .row .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1px solid var(--line);
        flex: 0 0 auto;
      }
      .row.keep .dot {
        background: var(--green);
        border-color: var(--green);
      }
      .row.revert .dot {
        background: var(--amber);
        border-color: var(--amber);
      }
      .row img {
        width: 34px;
        height: 34px;
        object-fit: contain;
        flex: 0 0 auto;
      }
      .row span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .stage {
        position: relative;
        display: grid;
        place-items: center;
        padding: 24px;
        min-height: 0;
        /* The red the app puts behind the figure: white sleeves and pale hems only show on it. */
        background: #e3000b;
      }
      .figure {
        position: relative;
      }
      .layer {
        position: absolute;
        left: 0;
        display: block;
        /* The before/after flip is a swap, not a transition: anything that eases here reads as a
           difference between the two parts. */
        transition: none;
      }
      .plate {
        position: absolute;
        left: 24px;
        bottom: 20px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        color: #fff;
        font:
          500 13px/1 'DM Mono',
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .plate b {
        font-size: 18px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Accept</h1>
      <button class="btn" id="side">After <kbd>space</kbd></button>
      <button class="btn" id="prev">Prev <kbd>←</kbd></button>
      <button class="btn" id="next">Next <kbd>→</kbd></button>
      <button class="btn keep" id="keep">Keep <kbd>A</kbd></button>
      <button class="btn revert" id="revert">Revert <kbd>R</kbd></button>
      <button class="btn" id="undo">Undo <kbd>⌫</kbd></button>
      <button class="btn" id="shuffle">Shuffle rest <kbd>S</kbd></button>
      <button class="btn" id="apply">Apply reverts</button>
      <div class="stats" id="stats"></div>
      <div class="saved" id="saved"></div>
    </header>
    <main>
      <nav class="list" id="list"></nav>
      <section class="stage" id="stage">
        <div class="figure" id="figure"></div>
        <div class="plate">
          <b id="title"></b>
          <span id="sub"></span>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
